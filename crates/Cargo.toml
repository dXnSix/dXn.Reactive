[package]
name = "rayx_reactive"
description = "Reactive state: signals, computed values, effects, commands, event streams, and DynamicData-style observable collections."
readme = "../README.md"
keywords = ["reactive", "signals", "observable", "collections", "mvvm"]
categories = ["gui", "data-structures", "asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rayx_reactive"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
diagnostics = []

[dependencies]
futures.workspace = true
rxrust.workspace = true
serde.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.5.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.55"

[[bench]]
name = "reactive_complexity"
harness = false

[[bench]]
name = "delivery_complexity"
harness = false

[[bench]]
name = "keyed_sort"
harness = false

[[bench]]
name = "live_group"
harness = false

[[bench]]
name = "keyed_watch"
harness = false

[[bench]]
name = "list_diff"
harness = false

[[bench]]
name = "joins"
harness = false

[[bench]]
name = "tree"
harness = false

[[bench]]
name = "sort_and_page"
harness = false

[lints]
workspace = true
